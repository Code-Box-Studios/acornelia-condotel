name: acornelia
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: acornelia_dev
      POSTGRES_USER: acornelia
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Run pnpm local:setup first}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - acornelia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acornelia -d acornelia_dev']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  acornelia_postgres:
